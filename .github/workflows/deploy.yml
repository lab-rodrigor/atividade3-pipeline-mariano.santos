name: deploy

# O pipeline faz o que voce fez a mao na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: mariano-santos
  PORTA: 23200
  DB_SENHA: ${{ secrets.DB_SENHA }}

jobs:
  check-connection:
    name: Teste e Validação Inicial
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preparar a chave de deploy
        run: |
          set -x
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Testar Conexão SSH
        run: |
          set -x
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'echo "Conexao SSH OK!"'

  deploy:
    needs: check-connection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          set -x
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          set -x
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker rm -f front || true'
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker rm -f api || true'
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker rm -f banco || true'

      - name: Validar disponibilidade da porta externa
        run: |
          set -x
          sleep 5 # Aguarda o SO liberar a porta completamente
          if nc -w 5 -zv gr.lab.ayty.org ${{ env.PORTA }} 2>/dev/null; then
            echo "ERRO: A porta ${{ env.PORTA }} continua em uso no servidor mesmo apos derrubarmos nosso container! Possivel conflito com outro aluno."
            exit 1
          fi

      - name: Criar redes e volume
        run: |
          set -x
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker network create web || true'
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker network create dados --interna || true'
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker volume create pgdata || true'

      - name: Subir banco
        run: |
          set -x
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            'gr-docker run postgres:16-alpine \
              --name banco \
              --network dados \
              -e POSTGRES_PASSWORD=${{ env.DB_SENHA }} \
              -e POSTGRES_DB=pokedex \
              -v pgdata:/var/lib/postgresql/data \
              -d'

      - name: Subir API
        run: |
          set -x
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            'gr-docker run gr-atv2-api:1 \
              --name api \
              --network dados \
              -e POSTGRES_HOST=gr-${{ env.SLUG }}-banco \
              -e POSTGRES_DB=pokedex \
              -e POSTGRES_PASSWORD=${{ env.DB_SENHA }} \
              -d && \
             gr-docker network connect web api || true'

      - name: Subir Front
        run: |
          set -x
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            'gr-docker run gr-atv2-front:1 \
              --name front \
              --network web \
              -e API=gr-${{ env.SLUG }}-api \
              -e DEPLOY_SHA=${{ github.sha }} \
              -p ${{ env.PORTA }}:80 \
              -d'

      - name: Conferir que subiu
        run: |
          set -x
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://gr.lab.ayty.org:${{ env.PORTA }}/api/pokemons || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "OK - Front respondeu (HTTP 200)."
              exit 0
            fi
            echo "Tentativa $i falhou (status $STATUS). Aguardando 10s..."
            sleep 10
          done
          echo "ERRO - Front nao respondeu apos 60 segundos."
          exit 1

  rollback:
    name: Rollback em Caso de Falha
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Preparar a chave de deploy
        run: |
          set -x
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Limpar topologia falha
        run: |
          set -x
          echo "Rollback ativado: Houve erro no deploy. Removendo containers..."
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker rm -f front api banco || true'
