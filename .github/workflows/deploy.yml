name: deploy

# O pipeline faz o que voce fez a mao na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: mariano-santos
  PORTA: 23200

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker rm -f front || true'
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker rm -f api || true'
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker rm -f banco || true'

      - name: Criar redes e volume
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker network create web || true'
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker network create dados --interna || true'
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org 'gr-docker volume create pgdata || true'

      - name: Subir banco
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            'gr-docker run postgres:17-alpine \
              --name banco \
              --network dados \
              -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
              -e POSTGRES_DB=pokedex \
              -v pgdata:/var/lib/postgresql/data \
              -d'

      - name: Subir API
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            'gr-docker run gr-atv2-api:1 \
              --name api \
              --network dados \
              -e POSTGRES_HOST=gr-${{ env.SLUG }}-banco \
              -e POSTGRES_DB=pokedex \
              -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
              -d && \
             gr-docker network connect web api || true'

      - name: Subir Front
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            'gr-docker run gr-atv2-front:1 \
              --name front \
              --network web \
              -e API=gr-${{ env.SLUG }}-api \
              -e DEPLOY_SHA=${{ github.sha }} \
              -p ${{ env.PORTA }}:80 \
              -d'

      - name: Conferir que subiu
        run: |
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://gr.lab.ayty.org:${{ env.PORTA }}/api/pokemons || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "OK - Front respondeu (HTTP 200)."
              exit 0
            fi
            echo "Tentativa $i falhou (status $STATUS). Aguardando 10s..."
            sleep 10
          done
          echo "ERRO - Front nao respondeu apos 60 segundos."
          exit 1
